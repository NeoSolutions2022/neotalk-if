server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # ===================================================================
  # Embed allowlist for /widget (CSP frame-ancestors)
  # ===================================================================
  # MUST match environment variable WIDGET_FRAME_ANCESTORS at deploy time.
  # Recommended value for homolog:
  # WIDGET_FRAME_ANCESTORS="'self' https://infra-neotalkif.k3p3ex.easypanel.host https://portal.ifce.edu.br https://www.ifce.edu.br"
  set $widget_frame_ancestors "${WIDGET_FRAME_ANCESTORS}";

  # Widget route: embeddable only by explicit allowlist (no open embed)
  # Keep this specific location block before the generic SPA fallback.
  location = /widget {
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "accelerometer=(), autoplay=(self), camera=(), geolocation=(), gyroscope=(), microphone=(), payment=(), usb=()" always;
    # Intentionally omit X-Frame-Options here because SAMEORIGIN would block authorized third-party embeds.
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; media-src 'self' https://player.vimeo.com https://vimeo.com; frame-src https://player.vimeo.com https://vimeo.com; frame-ancestors $widget_frame_ancestors; base-uri 'none'; form-action 'none'" always;

    try_files $uri $uri/ /index.html;
  }

  # Default/app routes: protected against clickjacking (not embeddable)
  location / {
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "accelerometer=(), autoplay=(self), camera=(), geolocation=(), gyroscope=(), microphone=(), payment=(), usb=()" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;

    try_files $uri $uri/ /index.html;
  }
}
