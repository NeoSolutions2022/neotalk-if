server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # ===================================================================
  # Embed allowlist for /widget (CSP frame-ancestors)
  #
  # IMPORTANT:
  # - Never use frame-ancestors *
  # - Keep an explicit allowlist by environment
  # - Replace this line during deployment (templating/envsubst/helm/etc.)
  #
  # Examples:
  # DEV:      'self' http://localhost:3000 http://127.0.0.1:3000
  # IFCE:     'self' https://portal.ifce.edu.br https://www.ifce.edu.br
  # BrasilSeg:'self' https://app.brasilseg.com.br https://www.brasilseg.com.br
  # ===================================================================
  set $widget_frame_ancestors "'self'";

  # Default/app routes: protected against clickjacking (not embeddable)
  location / {
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "accelerometer=(), autoplay=(self), camera=(), geolocation=(), gyroscope=(), microphone=(), payment=(), usb=()" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;

    try_files $uri $uri/ /index.html;
  }

  # Widget route: embeddable only by explicit allowlist (no open embed)
  location = /widget {
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "accelerometer=(), autoplay=(self), camera=(), geolocation=(), gyroscope=(), microphone=(), payment=(), usb=()" always;
    # Intentionally omit X-Frame-Options here because SAMEORIGIN would block third-party authorized embeds.
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; media-src 'self' https://player.vimeo.com https://vimeo.com; frame-src https://player.vimeo.com https://vimeo.com; frame-ancestors $widget_frame_ancestors; base-uri 'none'; form-action 'none'" always;

    try_files $uri $uri/ /index.html;
  }
}
